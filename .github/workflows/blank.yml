```yaml
name: WhatsApp Clone CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      # Get source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci

      # Build Vue/Vite application
      - name: Build frontend
        run: npm run build


  # ==========================================
  # BACKEND CI
  # ==========================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      # Get source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Check JavaScript syntax
      - name: Check backend syntax
        working-directory: backend
        run: node --check index.js


 
